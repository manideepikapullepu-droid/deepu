```html
<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: pink;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #d81b60;
            font-size: 45px;
            animation: bounce 1.5s infinite;
        }

        p {
            color: #880e4f;
            font-size: 24px;
        }

        /* Cake */
        .cake {
            position: relative;
            width: 220px;
            height: 120px;
            background: #8d5524;
            border-radius: 15px 15px 25px 25px;
            margin: 80px auto 20px;
            box-shadow: 0 8px 0 #6d3f1b;
        }

        .icing {
            position: absolute;
            top: -20px;
            width: 100%;
            height: 40px;
            background: #fff0f5;
            border-radius: 50%;
        }

        /* Candles */
        .candle {
            position: absolute;
            top: -70px;
            width: 12px;
            height: 50px;
            background: #ff4081;
            border-radius: 5px;
        }

        .candle1 { left: 50px; }
        .candle2 { left: 104px; }
        .candle3 { left: 158px; }

        .flame {
            position: absolute;
            top: -25px;
            left: 1px;
            width: 10px;
            height: 18px;
            background: orange;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            animation: flicker 0.4s infinite alternate;
        }

        /* Balloons */
        .balloon {
            position: absolute;
            width: 55px;
            height: 70px;
            border-radius: 50%;
            animation: float 3s infinite ease-in-out;
        }

        .b1 {
            background: #ff4081;
            left: 10%;
            top: 20%;
        }

        .b2 {
            background: #e91e63;
            right: 10%;
            top: 25%;
            animation-delay: 0.5s;
        }

        .b3 {
            background: #f06292;
            left: 20%;
            bottom: 10%;
            animation-delay: 1s;
        }

        .b4 {
            background: #c2185b;
            right: 20%;
            bottom: 12%;
            animation-delay: 1.5s;
        }

        @keyframes bounce {
            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes flicker {
            from {
                transform: rotate(-45deg) scale(1);
            }
            to {
                transform: rotate(-45deg) scale(1.2);
            }
        }

        @keyframes float {
            50% {
                transform: translateY(-30px);
            }
        }

        .heart {
            color: #e91e63;
            font-size: 35px;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            50% {
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>

    <div class="container">

        <h1>🎉 Happy Birthday, My Friend! 🎂</h1>

        <div class="cake">
            <div class="icing"></div>

            <div class="candle candle1">
                <div class="flame"></div>
            </div>

            <div class="candle candle2">
                <div class="flame"></div>
            </div>

            <div class="candle candle3">
                <div class="flame"></div>
            </div>
        </div>

        <p>
            Wishing you lots of happiness,<br>
            love, success and beautiful memories! 💖
        </p>

        <div class="heart">❤️</div>

    </div>

</body>
</html>
